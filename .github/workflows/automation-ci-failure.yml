name: Report automation CI failure

# When CI fails on one of the updater's own branches, file or update the issue
# for that upstream version.
#
# The updater workflow can only report failures it sees itself — a bad
# signature or an unreachable origin. A candidate that verifies cleanly and
# then fails to build, or fails the graphical smoke test, only shows up much
# later when CI finishes on the pull request. That is exactly the packaging
# drift and runtime regression the failure policy cares about, so it needs to
# reach an issue too.
#
# `workflow_run` runs from the default branch with this repository's own
# configuration, never from the pull request's code, so it is safe to give it a
# token here.
#
# `cancelled` is deliberately not reported: pushing a fresh commit to an
# automation branch cancels the previous run by design, and that is not a
# failure of the candidate.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

# Inspecting the failed run needs `actions: read` and filing the issue needs
# `issues: write`. Neither is among the updater App's three permissions, and
# widening the App to cover them would give the thing that opens auto-merged
# pull requests more reach than it needs. A job-scoped GITHUB_TOKEN is the
# right instrument: it cannot open a pull request, and it expires with the job.
permissions:
  contents: read
  actions: read
  issues: write

jobs:
  report:
    name: File or update the version's issue
    # Only automation branches, and only failures.
    #
    # The head repository must be this one. `workflow_run` also fires for pull
    # requests from forks, and a fork can name its branch anything it likes --
    # including something that looks like automation. Without this condition a
    # fork could make a trusted bot file issues containing text it chose.
    if: >
      (github.event.workflow_run.conclusion == 'failure' ||
       github.event.workflow_run.conclusion == 'timed_out' ||
       github.event.workflow_run.conclusion == 'startup_failure') &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      startsWith(github.event.workflow_run.head_branch, 'automation/chatgpt-')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Shares its concurrency group with the updater's own reporter, so the two
    # cannot race to create the same per-version issue.
    concurrency:
      # Same group the updater's own reporter uses, so the two cannot race to
      # create one version's issue.
      group: report-failure-${{ github.event.workflow_run.head_branch }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Classify the failure and report it
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          set -eu

          # automation/chatgpt-<encoded-version>. The encoding is reversible,
          # so decode it back to the real Debian version the issue is about --
          # reporting the percent-encoded form would key the issue on something
          # no human recognises.
          encoded="${BRANCH#automation/chatgpt-}"
          if ! printf '%s' "$encoded" | grep -qE '^[A-Za-z0-9._%-]{1,160}$'; then
            echo "refusing to report on an unexpected branch name: $BRANCH" >&2
            exit 1
          fi
          version="$(python3 -c '
          import sys
          sys.path.insert(0, "tools")
          import apt_trust as T
          decoded = T.decode_version_from_ref(sys.argv[1])
          # Round-trip: the branch must be exactly what this version encodes to,
          # so a hand-made branch cannot smuggle arbitrary text into a title.
          if T.encode_version_for_ref(decoded) != sys.argv[1]:
              raise SystemExit("branch is not a canonical encoding")
          print(decoded)' "$encoded")"
          echo "reporting on version $version (branch $BRANCH)"

          # Work out which gate failed, so the issue says whether this is
          # packaging drift or a runtime regression rather than just "CI red".
          failed="$(gh api "repos/${{ github.repository }}/actions/runs/$RUN_ID/jobs" \
            --jq '.jobs[] | select(.conclusion == "failure") | .name' | tr '\n' ',')"
          echo "failed jobs: $failed"

          case "${{ github.event.workflow_run.conclusion }}" in
            timed_out|startup_failure) kind=timeout ;;
            *)
              case "$failed" in
                *"Verify signed sources"*|*"Changed-file policy"*) kind=trust ;;
                *"Graphical VM smoke"*)                            kind=runtime ;;
                *"Build"*|*"Unit tests"*)                          kind=build ;;
                *)                                                 kind=unknown ;;
              esac
              ;;
          esac
          echo "classified as: $kind"

          python3 tools/report_failure.py \
            --repo "${{ github.repository }}" \
            --version "$version" \
            --kind "$kind" \
            --run-url "$RUN_URL"

          echo "The automation pull request stays open and unmerged; main and" \
               "the latest release are untouched."
